name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Regla de 100 lineas
        run: npm run check:size
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas
        run: npm test
      - name: Build
        run: npm run build
