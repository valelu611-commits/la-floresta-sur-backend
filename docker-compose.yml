services:
  db:
    image: postgis/postgis:16-3.4
    container_name: floresta-db
    environment:
      POSTGRES_DB: lafloresta
      POSTGRES_USER: floresta
      POSTGRES_PASSWORD: floresta_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgres/01-extension.sql:/docker-entrypoint-initdb.d/01-extension.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floresta -d lafloresta"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: floresta-backend
    environment:
      PORT: 4000
      DB_ENGINE: postgres
      DATABASE_URL: postgres://floresta:floresta_dev@db:5432/lafloresta
      DB_SSL: "false"
      ADMIN_API_KEY: dev-admin-key
      SEED_ON_START: "true"
      CORS_ORIGINS: "*"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
