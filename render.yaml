# Publica este servicio como Web Service (Docker) en Render.
# Dashboard > New > Web Service > conecta el repo la-floresta-sur-backend.
services:
  - type: web
    name: la-floresta-sur-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /internal/health
    autoDeploy: true
    envVars:
      - key: DB_ENGINE
        value: postgres
      - key: DB_SSL
        value: "true"
      - key: SEED_ON_START
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
